# Render Blueprint for the ChurchConnect API.
#
# Dashboard -> New -> Blueprint -> pick this repository. Render reads this file
# and creates the API web service with its secrets. You are prompted once for
# DATABASE_URL; everything else is filled in here.
#
# The React client is NOT defined here: it lives on Vercel, with
# client/vercel.json forwarding /api/* to this service.
services:
  - type: web
    name: churchconnect-api
    runtime: node
    region: frankfurt
    # FREE PLAN: no card required. The service sleeps after 15 idle minutes
    # (the first request afterwards takes ~50 s) and cannot have a persistent
    # disk, so uploaded member photos vanish on each restart or deploy.
    # Everything else lives in Supabase and is safe.
    #
    # To go live properly, change to `plan: starter` and add back the disk:
    #   disk:
    #     name: uploads
    #     mountPath: /opt/render/project/src/server/uploads
    #     sizeGB: 1
    # then set UPLOAD_DIR below to that mountPath. Render will ask for a card.
    plan: free
    rootDir: server
    # --include=dev: Render builds with NODE_ENV=production, which makes npm ci
    # skip devDependencies - and tsc plus every @types/* package live there.
    buildCommand: npm ci --include=dev && npm run build
    # migrate:prod is safe to run on every deploy; applied migrations are skipped.
    startCommand: npm run migrate:prod && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        # Supabase -> Connect -> Session pooler, port 5432, password percent-encoded.
        sync: false
      - key: PGSSL
        value: "true"
      - key: CLIENT_ORIGIN
        value: https://church-connect-omega.vercel.app
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: ./uploads
      - key: TZ
        value: Africa/Accra
      - key: ENABLE_JOBS
        value: "true"
      # Requests arrive through Vercel's rewrite proxy and then Render's own
      # proxy: two hops. See TRUST_PROXY in server/src/config/env.ts.
      - key: TRUST_PROXY
        value: "2"
